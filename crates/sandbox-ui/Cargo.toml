[package]
name = "sandbox-ui"
description = "Shared bevy layer for the pygame sandbox games."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
pixelfont.workspace = true
touch.workspace = true

# The desktop draws with bevy's renderer (`display::gpu`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = [
    "2d",
    "bevy_state",
    "audio",
    "wav",
    "x11",
    "wayland",
] }

# The browser draws with the page canvas's 2D context (`web_display`), so it
# needs no renderer.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "Storage",
    "Window",
] }

[lints]
workspace = true
