name: Pages

# Build the browser versions of the games and publish them to GitHub Pages:
# a landing page at / and one folder per game (/gameoflife/, /sandsimulator/).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Tools for the browser builds
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen
          # Must match the wasm-bindgen version in Cargo.lock.
          cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Build the site
        run: cargo xtask build-web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
