name: Pages

# Build the browser versions of the games and publish them to GitHub Pages:
# a landing page at / and one folder per game (/gameoflife/, /tetris/,
# /sandsimulator/, /pong/, /snake/, /minesweeper/, /merge/, /bricks/).

# It runs after CI passes on master, so a commit that fails format, lint or
# tests is never published; it can also be started by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # The commit CI checked (empty when started by hand: the branch head).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Tools for the browser builds
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen
          # The CLI must match the wasm-bindgen crate in Cargo.lock.
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the site
        run: cargo xtask build-web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
