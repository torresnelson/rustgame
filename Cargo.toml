[workspace]
resolver = "3"
members = ["crates/*", "games/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
sandbox-ui = { path = "crates/sandbox-ui" }
pixelfont = { path = "crates/pixelfont" }
touch = { path = "crates/touch" }
life = { path = "crates/life" }
tetris-core = { path = "crates/tetris-core" }
pong-core = { path = "crates/pong-core" }
sand = { path = "crates/sand" }
snake-core = { path = "crates/snake-core" }
mines-core = { path = "crates/mines-core" }
merge-core = { path = "crates/merge-core" }
bricks-core = { path = "crates/bricks-core" }
pinball-core = { path = "crates/pinball-core" }
sfx = { path = "crates/sfx" }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# What every build needs: the app, window, input, time and log. The renderer
# is added for the desktop only (see `crates/sandbox-ui/Cargo.toml`); the
# browser shows the games with a 2D canvas, so its download leaves it out.
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_log",
    "bevy_winit",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy is slow without optimisations; optimise dependencies even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Browser builds: small downloads over speed of compiling.
#   cargo build --profile web-release --target wasm32-unknown-unknown
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
# Only debug info: wasm-bindgen needs the target_features section that a full
# strip removes; `cargo xtask build-web` strips the rest with wasm-opt.
strip = "debuginfo"
panic = "abort"
